# =========================
# ARCALOS HYPRLAND CONFIG
# =========================

# ========== ENV ==========
env = QT_QPA_PLATFORM,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# ========== MONITORS ==========
monitor = ,preferred,auto,auto

# ========== AUTOSTART ==========
exec-once = dbus-update-activation-environment --systemd --all
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waybar
exec-once = nm-applet &
exec-once = dunst
exec-once = wl-paste --type text --watch cliphist store

# ========== INPUT ==========
input {
    kb_layout = us
    follow_mouse = 1
    natural_scroll = true
    numlock_by_default = true
}

# ========== GENERAL ==========
general {
    gaps_in = 5
    gaps_out = 5
    border_size = 2
    layout = dwindle
}

# ========== DECORATION ==========
decoration {
    rounding = 12

    shadow {
        enabled = true
        range = 30
        render_power = 5
        color = rgba(00000070)
    }
}

# ========== ANIMATIONS ==========
animations {
    enabled = true

    animation = windowsIn, 1, 3, default
    animation = windowsOut, 1, 3, default
    animation = workspaces, 1, 5, default
    animation = windowsMove, 1, 4, default
}

# ========== LAYOUT ==========
dwindle {
    preserve_split = true
}

# ========== MISC ==========
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ========== KEY VARIABLES ==========
$mod = SUPER

# ========== CORE APPS ==========
$terminal = kitty
$browser = brave
$launcher = rofi -show drun

# ========== KEYBINDS (ARCALOS CORE UX) ==========

# launchers (your "shell layer")
bind = $mod, RETURN, exec, $terminal
bind = $mod, D, exec, $launcher
bind = $mod, B, exec, $browser

# system UI (DMS replacements)
bind = $mod, SPACE, exec, rofi -show drun
bind = $mod, TAB, exec, rofi -show window
bind = $mod, X, exec, wlogout
bind = $mod, V, exec, cliphist list | rofi -dmenu | cliphist decode | wl-copy

# window management
bind = $mod, Q, killactive
bind = $mod, F, fullscreen
bind = $mod, T, togglefloating

# focus (vim-style)
bind = $mod, H, movefocus, l
bind = $mod, J, movefocus, d
bind = $mod, K, movefocus, u
bind = $mod, L, movefocus, r

# move windows
bind = $mod SHIFT, H, movewindow, l
bind = $mod SHIFT, J, movewindow, d
bind = $mod SHIFT, K, movewindow, u
bind = $mod SHIFT, L, movewindow, r

# workspaces
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5

bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5

# system controls (keep simple, replace DMS IPC)
bind = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bind = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bind = , XF86AudioMute, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

bind = , XF86MonBrightnessUp, exec, brightnessctl set +5%
bind = , XF86MonBrightnessDown, exec, brightnessctl set 5%-

# screenshot
bind = $mod SHIFT, S, exec, grimblast save area

# exit/reload
bind = $mod SHIFT, Q, exit
bind = $mod SHIFT, R, reload

# ========== WINDOW RULES ==========
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(org.gnome.Calculator)$
windowrulev2 = float, title:^(Picture-in-Picture)$
