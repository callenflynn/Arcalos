# =========================
# ARCALOS HYPRLAND CONFIG
# =========================
# UX authority: docs/UX.md. Theme authority: theme/colors.conf.

# ========== ENV ==========
env = QT_QPA_PLATFORM,wayland
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# ========== MONITORS ==========
monitor = ,preferred,auto,auto

# ========== AUTOSTART ==========
exec-once = dbus-update-activation-environment --systemd --all
exec-once = gnome-keyring-daemon --start --components=secrets
exec-once = systemctl --user import-environment WAYLAND_DISPLAY XDG_CURRENT_DESKTOP
exec-once = waybar
exec-once = nm-applet &
exec-once = dunst
exec-once = wl-paste --type text --watch cliphist store

# ========== INPUT ==========
input {
    kb_layout = us
    follow_mouse = 1
    natural_scroll = true
    numlock_by_default = true
}

# ========== GENERAL ==========
general {
    gaps_in = 5
    gaps_out = 6
    border_size = 2
    # Mirrors arcalos_accent and arcalos_border from theme/colors.conf.
    col.active_border = rgba(38bdf8cc)
    col.inactive_border = rgba(94a3b82e)
    layout = dwindle
}

# ========== DECORATION ==========
decoration {
    rounding = 12

    blur {
        enabled = true
        size = 6
        passes = 2
        vibrancy = 0.18
    }

    shadow {
        enabled = true
        range = 18
        render_power = 3
        color = rgba(00000045)
    }
}

# ========== ANIMATIONS ==========
animations {
    enabled = true

    animation = windowsIn, 1, 3, default
    animation = windowsOut, 1, 3, default
    animation = workspaces, 1, 5, default
    animation = windowsMove, 1, 4, default
}

# ========== LAYOUT ==========
dwindle {
    preserve_split = true
}

# ========== MISC ==========
misc {
    disable_hyprland_logo = true
    disable_splash_rendering = true
}

# ========== KEY VARIABLES ==========
$mod = SUPER

# ========== CORE APPS ==========
$terminal = kitty
$browser = brave
$launcher = rofi -show drun

# ========== KEYBINDS ==========
source = ~/.config/hypr/keybinds.conf

# ========== WINDOW RULES ==========
windowrulev2 = float, class:^(pavucontrol|blueman-manager|nm-connection-editor|org.gnome.Calculator)$
windowrulev2 = float, title:^(Picture-in-Picture)$
