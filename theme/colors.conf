/* Arcalos theme source.
 * UX authority: docs/UX.md.
 * Waybar imports this file directly from ~/.config/theme/colors.conf.
 */

@define-color arcalos_base #090b10;
@define-color arcalos_surface rgba(15, 18, 26, 0.72);
@define-color arcalos_surface_strong rgba(22, 27, 38, 0.86);
@define-color arcalos_border rgba(148, 163, 184, 0.18);
@define-color arcalos_text #f8fafc;
@define-color arcalos_text_soft #cbd5e1;
@define-color arcalos_muted #94a3b8;
@define-color arcalos_accent #38bdf8;
@define-color arcalos_accent_soft rgba(56, 189, 248, 0.18);
@define-color arcalos_warning #f59e0b;
@define-color arcalos_critical #ef4444;

/* Non-CSS token intent for Hyprland/Rofi parity:
 * background transparency: arcalos_surface at 0.72
 * strong transparency: arcalos_surface_strong at 0.86
 * border color: arcalos_border
 * accent color: arcalos_accent
 * blur intent: enabled, size 6, passes 2, vibrancy 0.18
 * shadow intent: subtle, range 18, render power 3, black at 0.27
 */
